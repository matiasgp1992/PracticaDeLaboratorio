<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm w-100" style="max-width: 420px;">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1">Iniciar sesión</h1>
      <p class="text-muted text-center mb-4">Ingresá con tu cuenta del estudio</p>

      @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" formControlName="email"
                 [class.is-invalid]="invalido('email')">
          <div class="invalid-feedback">Ingresá un email válido.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password"
                 [class.is-invalid]="invalido('password')">
          <div class="invalid-feedback">Ingresá tu contraseña.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Ingresar
        </button>
      </form>

      <p class="text-center mt-3 mb-0">
        ¿No tenés cuenta? <a routerLink="/registro">Registrá tu estudio</a>
      </p>
    </div>
  </div>
</div>
